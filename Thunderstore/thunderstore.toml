[config]
schemaVersion = "0.0.1"

[package]
namespace = "Keevi"
name = "PerformanceTweaks"
versionNumber = "1.0.0"
description = "Optimization mod for Sailwind: higher FPS and better overall performance"
websiteUrl = "https://github.com/KeeviDev/SailwindPerformanceTweaks"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"

[build]
icon = "../attachments/icon.png"
readme = "../bin/Thunderstore/README.md"
outdir = "../bin/Publish"

[[build.copy]]
source = "../bin/Release/PerformanceTweaks.dll"
target = "PerformanceTweaks/PerformanceTweaks.dll"

[[build.copy]]
source = "../CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["sailwind"]

[publish.categories]
sailwind = ["mods"]
